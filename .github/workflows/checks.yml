name: Vérifications locales
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check swing tests
      - run: python -m ruff format --check swing tests
      - run: python -m mypy swing
      - run: node --check swing/static/app.js
      - run: python -c "from pathlib import Path; Path('data').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp=data/ci-tests
