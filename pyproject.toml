[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-swing-local"
version = "0.1.0"
description = "Atelier local de simulation swing actions et FNB américains"
requires-python = ">=3.11"
dependencies = ["tzdata==2026.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.14", "mypy==2.1.0", "playwright==1.59.0"]

[tool.setuptools.package-data]
swing = ["static/*"]

[tool.setuptools.packages.find]
include = ["swing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["swing"]
